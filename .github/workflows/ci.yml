name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Typecheck, migrate and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zolvex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI uses one throwaway database for both roles. Locally these are two
      # separate databases (zolvex / zolvex_test) so the suite never touches dev
      # data; in CI the whole container is discarded after the run, so a single
      # database is simpler and equivalent.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zolvex_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/zolvex_test?schema=public
      # Throwaway values for this ephemeral CI run only -- never real secrets,
      # never used outside the disposable Postgres container above. Locally
      # these live in the gitignored apps/api/.env (see .env.example).
      ADMIN_2FA_ENCRYPTION_KEY: 83b4804f7aeb794ffaa96cc77aaa671ce4e0cc79db01d6b1dbfdd2bca23f4a16
      JWT_SECRET: 9a3cbca6364ab7f631d14cce81da53777c584165d63b0a2aeb3205a3b3fec193

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/api

      - name: Apply migrations
        run: npm run db:migrate:test --workspace=apps/api

      - name: Typecheck
        run: npm run typecheck --workspace=apps/api

      - name: Test
        # Real credentials (GitHub encrypted repo secrets), scoped to only
        # this step -- not the job-level env -- so earlier steps (in
        # particular `npm install`, where a compromised transitive
        # dependency's postinstall script would otherwise have a shot at
        # them) never see these values. The upload test genuinely calls the
        # live Cloudinary API, so these can't be throwaway values like the
        # two job-level secrets above.
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: npm run test --workspace=apps/api

      - name: Typecheck web
        run: npm run typecheck --workspace=apps/web

      - name: Test web
        run: npm run test --workspace=apps/web

      - name: Audit dependencies
        # Non-blocking: Foundation has no dependency policy yet, so this reports
        # findings without failing the build. Tighten once a policy is agreed.
        run: npm audit --production || true
